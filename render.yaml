# Render Blueprint: Dashboard → New → Blueprint → chọn repo dualface → Apply.
#
# Không có Upstash: bảng xếp hạng lưu trong bộ nhớ, mất khi server ngủ (15 phút không ai chơi)
# hoặc deploy lại. Game tự ghi "tạm thời" cho người chơi biết.
#
# Bật bảng xếp hạng lâu dài: vào service → Environment → thêm 2 biến
#   UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN
# Có thể dùng chung database Upstash với repo khác: Dual Face chỉ dùng khoá bắt đầu bằng "df:v2:".
services:
  - type: web
    name: dualface
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
