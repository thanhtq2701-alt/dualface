name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Server khởi động được
        run: |
          PORT=8099 node server/index.js &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8099/api/health && exit 0; sleep 0.5; done
          exit 1
